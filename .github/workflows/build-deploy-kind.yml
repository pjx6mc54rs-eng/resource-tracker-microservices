name: Deploy Microservices to GCP VM

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Direct Kubernetes Deploy on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e

            echo "📂 Navigation dans le projet..."
            cd ~/resource-tracker-microservices

            echo "🧹 Nettoyage des modifications locales sur la VM..."
            git reset --hard HEAD
            git clean -fd

            echo "📥 Récupération des derniers commits..."
            git pull origin master

            echo "🚀 Application des manifestes Kubernetes..."
            kubectl apply -k k8s/

            echo "🔄 Redémarrage des services..."
            services=(
              auth-service
              project-service
              timesheet-service
              reporting-service
              chat-service
              notification-service
              api-gateway
              frontend
            )

            for service in "${services[@]}"; do
              echo "Redémarrage de $service..."
              kubectl rollout restart "deployment/$service" -n resource-tracker || true
            done
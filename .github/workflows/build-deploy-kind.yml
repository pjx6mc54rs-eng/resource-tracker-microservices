name: Deploy Microservices to GCP VM

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Direct Kubernetes Deploy on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e

            # Export explicite du fichier kubeconfig de l'utilisateur
            export KUBECONFIG=$HOME/.kube/config

            # Nom du cluster kind (à adapter si différent)
            KIND_CLUSTER_NAME="resource-tracker"

            # Tag d'image basé sur le SHA du commit pour forcer le remplacement
            IMAGE_TAG="${{ github.sha }}"

            # Utilisateur postgres (défaut "admin" si non défini sur la VM)
            export POSTGRES_USER="${POSTGRES_USER:-admin}"

            ROOT_DIR="$HOME/resource-tracker-microservices"
            cd "$ROOT_DIR"

            # "git pull" echoue des qu'un force-push a eu lieu sur origin :
            # l'historique de la VM diverge et git refuse de trancher
            # ("Need to specify how to reconcile divergent branches").
            # fetch + reset --hard aligne la VM sur origin quoi qu'il arrive,
            # ce qui est deja l'intention : la VM ne doit rien contenir de local.
            echo "📥 Récupération et alignement strict sur origin/master..."
            git fetch origin master
            git reset --hard origin/master
            git clean -fd

            echo "→ Commit déployé : $(git log --oneline -1)"

            echo "🔎 Vérification du cluster kind..."
            kind get clusters | grep -q "^${KIND_CLUSTER_NAME}$" || {
              echo "❌ Cluster kind '${KIND_CLUSTER_NAME}' introuvable."
              exit 1
            }

            # ==================================================================
            # 0. NETTOYAGE DISQUE
            # Chaque deploiement ajoute 8 images taguees par SHA sur l'hote ET
            # dans le noeud kind. Sans purge, le disque sature et npm ci echoue
            # avec ENOSPC (constate a 96% d'occupation).
            # ==================================================================
            echo "🧹 Purge du cache de build (plafonne a 5 Go)..."
            docker builder prune -af --keep-storage 5GB || docker builder prune -af || true

            # Les images des commits precedents sont deja copiees dans containerd
            # cote noeud kind : la copie hote ne sert plus a rien. Purger ici, et
            # pas seulement en fin de workflow, evite qu'un run en echec laisse le
            # disque sature pour le run suivant.
            echo "🧹 Purge des images hote des deploiements precedents..."
            docker image prune -af || true

            AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
            echo "💾 Espace disponible : ${AVAIL_GB} Go"
            if [ "$AVAIL_GB" -lt 5 ]; then
              echo "❌ Moins de 5 Go libres, les builds npm vont echouer (ENOSPC)."
              echo "   Purge manuelle requise : docker image prune -af"
              exit 1
            fi

            # ==================================================================
            # 1. BUILD + CHARGEMENT DES IMAGES
            # ==================================================================
            SERVICES=(
              auth-service
              project-service
              timesheet-service
              reporting-service
              chat-service
              notification-service
              meeting-service
              api-gateway
              frontend
            )

            for service in "${SERVICES[@]}"; do
              if [ -d "./$service" ]; then
                echo "🐳 Build de l'image $service:$IMAGE_TAG..."
                docker build -t "$service:$IMAGE_TAG" -t "$service:latest" "./$service"

                echo "📦 Chargement de l'image $service dans le cluster kind..."
                kind load docker-image "$service:$IMAGE_TAG" --name "$KIND_CLUSTER_NAME"
                kind load docker-image "$service:latest" --name "$KIND_CLUSTER_NAME"
              else
                echo "⚠️  Dossier ./$service introuvable, build ignoré."
              fi
            done

            # ==================================================================
            # 2. APPLICATION DES MANIFESTES KUBERNETES
            # ==================================================================
            echo "🚀 Application des manifestes Kubernetes..."
            kubectl apply -k k8s/

            echo "⏳ Attente que postgres soit prêt..."
            kubectl rollout status deployment/postgres -n resource-tracker --timeout=120s || true

            # ==================================================================
            # 3. VÉRIFICATION / CRÉATION DES BASES DE DONNÉES
            # ==================================================================
            DATABASES=(auth_db project_db timesheet_db reporting_db chat_db notification_db)

            run_psql() {
              # $1 = base cible, $2 = commande SQL
              kubectl exec -n resource-tracker deployment/postgres -- \
                psql -U "$POSTGRES_USER" -d "$1" -c "$2"
            }

            run_psql_select() {
              # $1 = base cible, $2 = requête SQL (retourne une seule valeur)
              kubectl exec -n resource-tracker deployment/postgres -- \
                psql -U "$POSTGRES_USER" -d "$1" -tAc "$2"
            }

            echo "🔍 Vérification des bases de données..."
            for DB in "${DATABASES[@]}"; do
              DB_EXISTS=$(run_psql_select postgres "SELECT 1 FROM pg_database WHERE datname='$DB'" | tr -d '[:space:]')
              if [ "$DB_EXISTS" != "1" ]; then
                echo "→ Base '$DB' manquante. Création en cours..."
                run_psql postgres "CREATE DATABASE $DB;"
                echo "✅ Base '$DB' créée."
              else
                echo "✅ Base '$DB' déjà présente."
              fi
            done

            # ==================================================================
            # 4. EXÉCUTION DES MIGRATIONS TYPEORM PAR SERVICE
            # ==================================================================
            export DATABASE_HOST="${DATABASE_HOST:-localhost}"
            export DATABASE_PORT="${DATABASE_PORT:-5432}"
            export DATABASE_USER="${DATABASE_USER:-admin}"
            export DATABASE_PASSWORD="${DATABASE_PASSWORD:-admin}"

            MIGRATION_SERVICES=(auth-service project-service timesheet-service reporting-service chat-service meeting-service)

            for service in "${MIGRATION_SERVICES[@]}"; do
              echo "============================================================"
              echo "=== Migrations : $service ==="
              echo "============================================================"

              if [ ! -f "$service/src/data-source.ts" ]; then
                echo "❌ $service/src/data-source.ts introuvable — migrations ignorées."
                continue
              fi

              if [ ! -x "$service/node_modules/.bin/typeorm-ts-node-commonjs" ]; then
                echo "→ Installation des dépendances ($service) pour exécuter les migrations..."
                (cd "$service" && npm install)
              fi

              echo "→ Migrations détectées :"
              if ls "$service"/src/migrations/*.ts >/dev/null 2>&1; then
                for MIGRATION_FILE in "$service"/src/migrations/*.ts; do
                  echo "   - $(basename "$MIGRATION_FILE")"
                done
              else
                echo "   (aucune)"
              fi

              (
                cd "$service"
                echo "→ Exécution des migrations en attente..."
                ./node_modules/.bin/typeorm-ts-node-commonjs migration:run -d src/data-source.ts || true
              )
              echo "✅ $service : migrations à jour"
              echo ""
            done

            # ==================================================================
            # 5. AFFICHAGE DES TABLES PAR BASE
            # ==================================================================
            echo "=== 📋 Tables actuelles par base ==="
            for DB in "${DATABASES[@]}"; do
              echo "--- $DB ---"
              run_psql "$DB" "\dt" || echo "⚠️  Impossible de lister les tables de $DB"
              echo ""
            done

            # ==================================================================
            # 6. REDÉMARRAGE DES SERVICES
            # ==================================================================
            echo "🔄 Redémarrage des services..."
            for service in "${SERVICES[@]}"; do
              echo "Mise à jour de l'image pour $service..."
              kubectl set image "deployment/$service" "$service=$service:$IMAGE_TAG" -n resource-tracker || true

              echo "Redémarrage de $service..."
              kubectl rollout restart "deployment/$service" -n resource-tracker || true

              echo "⏳ Attente de la disponibilité de $service..."
              kubectl rollout status "deployment/$service" -n resource-tracker --timeout=120s || true
            done

            # ==================================================================
            # 7. PURGE DES IMAGES OBSOLETES
            # Fait apres le rollout : les pods tournent deja sur les nouvelles
            # images, donc les anciennes ne sont plus referencees.
            # Aucune purge de volumes ici : les donnees PostgreSQL y resident.
            # ==================================================================
            echo "🧹 Purge des images obsolètes sur l'hôte..."
            docker image prune -af || true

            echo "🧹 Purge des images orphelines dans le nœud kind..."
            docker exec "${KIND_CLUSTER_NAME}-control-plane" crictl rmi --prune || true

            echo "💾 Espace disque final :"
            df -h / | tail -1
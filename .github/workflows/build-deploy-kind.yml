name: Deploy Microservices to GCP VM

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e

            echo "📂 Navigation dans le projet..."
            cd ~/resource-tracker-microservices

            echo "🧹 Nettoyage des modifications locales sur la VM..."
            git reset --hard HEAD
            git clean -fd

            echo "📥 Récupération des derniers commits..."
            git pull origin master

            echo "🔨 Build des images et chargement dans Kind (desktop)..."
            services=(
              auth-service
              project-service
              timesheet-service
              reporting-service
              chat-service
              notification-service
              api-gateway
              frontend
            )

            for service in "${services[@]}"; do
              echo "--------------------------------------------------"
              echo "Building & loading $service..."
              docker build -t "resource-tracker-microservices-$service:latest" "./$service"
              kind load docker-image "resource-tracker-microservices-$service:latest" --name desktop
            done

            echo "🚀 Application des manifestes et redémarrage des pods..."
            kubectl apply -k k8s/

            for service in "${services[@]}"; do
              kubectl rollout restart "deployment/$service" -n resource-tracker
              kubectl rollout status "deployment/$service" -n resource-tracker --timeout=180s
            done
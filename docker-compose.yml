services:
  # ============================================================
  # Infrastructure partagée
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # port AMQP (publish/consume)
      - "15672:15672" # interface web d'administration (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # Microservices métier
  # ============================================================
  auth-service:
    build: ./auth-service
    container_name: auth-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: auth_db
      JWT_SECRET: change_this_secret
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./auth-service/uploads:/app/uploads

  project-service:
    build: ./project-service
    container_name: project-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: project_db
    depends_on:
      postgres:
        condition: service_healthy

  timesheet-service:
    build: ./timesheet-service
    container_name: timesheet-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: timesheet_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  reporting-service:
    build: ./reporting-service
    container_name: reporting-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: reporting_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  chat-service:
    build: ./chat-service
    container_name: chat-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: chat_db
      JWT_SECRET: change_this_secret
      CHAT_ENCRYPTION_KEY: 4698e7cef7ccbbfa98cf7b8fdcb333a697949df021f1cf3a65e2166618f1da5d
      PROJECT_SERVICE_URL: http://project-service:3000
      AUTH_SERVICE_URL: http://auth-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      project-service:
        condition: service_started

  # ============================================================
  # Passerelle et interface utilisateur
  # ============================================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3005:3000"
    environment:
      PORT: 3000
      JWT_SECRET: change_this_secret
      AUTH_SERVICE_URL: http://auth-service:3000
      PROJECT_SERVICE_URL: http://project-service:3000
      TIMESHEET_SERVICE_URL: http://timesheet-service:3000
      REPORTING_SERVICE_URL: http://reporting-service:3000
      CHAT_SERVICE_URL: http://chat-service:3000
    depends_on:
      - auth-service
      - project-service
      - timesheet-service
      - reporting-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Exposed to the browser, so use the host-mapped gateway address rather
      # than Docker's internal service hostname.
      - VITE_API_URL=http://localhost:3005
    depends_on:
      - api-gateway

volumes:
  pgdata:
  pgadmin_data:

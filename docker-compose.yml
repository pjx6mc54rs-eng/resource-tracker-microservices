services:
  # ============================================================
  # Infrastructure partagée
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # port AMQP (publish/consume)
      - "15672:15672" # interface web d'administration (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Relais TURN/STUN pour les appels WebRTC. Indispensable des qu'un pare-feu
  # ou un NAT symetrique empeche la connexion directe entre deux navigateurs :
  # coturn relaie alors le flux media. Le secret partage sert a derouler les
  # identifiants ephemeres calcules par chat-service (mecanisme REST de coturn).
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    network_mode: host
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --realm=resource-tracker
      --use-auth-secret --static-auth-secret=change_this_turn_secret
      --min-port=49160 --max-port=49200
      --no-tls --no-dtls --no-multicast-peers
      --fingerprint

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # Microservices métier
  # ============================================================
  auth-service:
    build: ./auth-service
    container_name: auth-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: auth_db
      JWT_SECRET: change_this_secret
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./auth-service/uploads:/app/uploads

  project-service:
    build: ./project-service
    container_name: project-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: project_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  timesheet-service:
    build: ./timesheet-service
    container_name: timesheet-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: timesheet_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      AUTH_SERVICE_URL: http://auth-service:3000
      PROJECT_SERVICE_URL: http://project-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: notification_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reporting-service:
    build: ./reporting-service
    container_name: reporting-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: reporting_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      # /reporting/dashboard verifie lui-meme la signature du jeton porteur :
      # il est joignable en direct sur le reseau compose et sert des agregats
      # couvrant toute l'entreprise. Meme secret qu'auth-service (qui signe) et
      # qu'api-gateway (qui verifie) ; sans lui le service repond 503.
      JWT_SECRET: change_this_secret
      # Le tableau de bord agrège les données amont a la volee : tous les
      # services ecoutent sur 3000 a l'interieur du reseau compose.
      AUTH_SERVICE_URL: http://auth-service:3000
      PROJECT_SERVICE_URL: http://project-service:3000
      TIMESHEET_SERVICE_URL: http://timesheet-service:3000
      CHAT_SERVICE_URL: http://chat-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  chat-service:
    build: ./chat-service
    container_name: chat-service
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: chat_db
      JWT_SECRET: change_this_secret
      CHAT_ENCRYPTION_KEY: 4698e7cef7ccbbfa98cf7b8fdcb333a697949df021f1cf3a65e2166618f1da5d
      # Configuration ICE servie au navigateur avant chaque appel WebRTC.
      # Sans TURN, les appels echouent entre deux postes derriere un NAT
      # symetrique ; le secret doit etre identique a celui de coturn.
      STUN_URLS: stun:stun.l.google.com:19302
      TURN_URLS: turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp
      TURN_SECRET: change_this_turn_secret
      TURN_TTL_SECONDS: 3600
      PROJECT_SERVICE_URL: http://project-service:3000
      AUTH_SERVICE_URL: http://auth-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      project-service:
        condition: service_started
    volumes:
      - ./chat-service/uploads:/app/uploads

  # ============================================================
  # Passerelle et interface utilisateur
  # ============================================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3005:3000"
    environment:
      PORT: 3000
      JWT_SECRET: change_this_secret
      AUTH_SERVICE_URL: http://auth-service:3000
      PROJECT_SERVICE_URL: http://project-service:3000
      TIMESHEET_SERVICE_URL: http://timesheet-service:3000
      REPORTING_SERVICE_URL: http://reporting-service:3000
      CHAT_SERVICE_URL: http://chat-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on:
      - auth-service
      - project-service
      - timesheet-service
      - reporting-service
      - notification-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Exposed to the browser, so use the host-mapped gateway address rather
      # than Docker's internal service hostname.
      - VITE_API_URL=http://localhost:3005
    depends_on:
      - api-gateway

volumes:
  pgdata:
  pgadmin_data:

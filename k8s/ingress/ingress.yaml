apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Ce nom reprend volontairement celui de l'ingress cree manuellement dans le
  # cluster le 2026-07-28. Sous un autre nom, l'admission webhook nginx refuse
  # la creation : host "_" et path "/api" ne peuvent etre definis qu'une fois.
  name: resource-tracker-main-ingress
  namespace: resource-tracker
  annotations:
    # Le TLS est termine par le nginx installe sur la VM, qui relaie ensuite en
    # clair vers le NodePort de cet ingress : rien a chiffrer ici.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # La messagerie et la signalisation des appels reposent sur une connexion
    # WebSocket longue ; sans ces delais, nginx la coupe au bout de 60 s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Le Service api-gateway expose le port 80 (targetPort 3000).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
    - host: app.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: pgadmin.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin-service
                port:
                  number: 80
    - host: rabbitmq.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq-service
                port:
                  number: 15672

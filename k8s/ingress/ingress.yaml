apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resource-tracker-ingress
  namespace: resource-tracker
spec:
  ingressClassName: nginx
  rules:
    # 1. ACCÈS DIRECT PAR IP (Pour téléphone)
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # 2. ACCÈS PAR NOM DE DOMAINE LOCAL (Pour Mac)
    - host: api.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000

    - host: app.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    - host: pgadmin.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80

    - host: rabbitmq.resource-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: resource-tracker
  labels:
    app: chat-service
spec:
  # Un seul replica, volontairement.
  #
  # Socket.IO conserve ses rooms en memoire de processus : « server.to(room)
  # .emit() » ne touche que les sockets connectes AU MEME pod. Avec deux
  # replicas et sans session persistante, un appelant et un appele repartis sur
  # des pods differents ne se voient jamais - l'invitation d'appel n'arrive pas
  # et le canal reste bloque sur une sonnerie sans fin.
  #
  # Passer a plusieurs replicas suppose un adaptateur partage (@socket.io/redis-adapter)
  # et un Redis dans le cluster.
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: resource-tracker-microservices-chat-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PORT
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DATABASE_PORT
        - name: DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DATABASE_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DATABASE_NAME_CHAT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: CHAT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: CHAT_ENCRYPTION_KEY
        - name: PROJECT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PROJECT_SERVICE_URL
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AUTH_SERVICE_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: STUN_URLS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: STUN_URLS
        - name: TURN_URLS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: TURN_URLS
        - name: TURN_TTL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: TURN_TTL_SECONDS
        - name: TURN_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TURN_SECRET
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: resource-tracker
  labels:
    app: chat-service
spec:
  selector:
    app: chat-service
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http

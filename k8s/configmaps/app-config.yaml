apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: resource-tracker
data:
  DATABASE_HOST: "postgres-service.resource-tracker.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_USER: admin
  DATABASE_NAME_AUTH: auth_db
  DATABASE_NAME_PROJECT: project_db
  DATABASE_NAME_TIMESHEET: timesheet_db
  DATABASE_NAME_REPORTING: reporting_db
  DATABASE_NAME_CHAT: chat_db
  DATABASE_NAME_NOTIFICATION: notification_db
  DATABASE_NAME_MEETING: meeting_db
  RABBITMQ_HOST: rabbitmq-service
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: admin
  RABBITMQ_URL: amqp://admin:admin@rabbitmq-service:5672
  AUTH_SERVICE_URL: http://auth-service:3000
  PROJECT_SERVICE_URL: http://project-service:3000
  TIMESHEET_SERVICE_URL: http://timesheet-service:3000
  REPORTING_SERVICE_URL: http://reporting-service:3000
  CHAT_SERVICE_URL: http://chat-service:3000
  NOTIFICATION_SERVICE_URL: http://notification-service:3000
  MEETING_SERVICE_URL: http://meeting-service:3000
  NODE_ENV: development
  PORT: "3000"
  # --- Appels WebRTC -------------------------------------------------------
  # STUN suffit quand les deux postes peuvent se joindre directement. TURN_URLS
  # reste vide tant qu'aucun relais n'est deploye : les appels fonctionnent
  # alors sauf entre deux reseaux a NAT strict. Renseigner l'adresse publique
  # de la VM, par exemple turn:34.12.34.56:3478?transport=udp
  STUN_URLS: "stun:stun.l.google.com:19302"
  TURN_URLS: ""
  TURN_TTL_SECONDS: "3600"
